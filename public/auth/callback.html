<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroDay // Autenticazione</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #060A12;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #0E1526;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      margin-top: 20px;
      background: #10B981;
      color: #060A12;
      font-weight: bold;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .meta {
      font-size: 12px;
      color: #94A3B8;
      line-height: 1.5;
      margin: 8px 0 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h3 style="color:#10B981;margin:0 0 6px;font-size:16px;letter-spacing:0.05em;">AUTENTICAZIONE RIUSCITA</h3>
    <p class="meta">Rientro nell'applicazione ZeroDay sul tuo dispositivo...</p>
    <a id="deepLinkBtn" href="#" class="btn" style="display:none;">APRI NELL'APP ZERODAY</a>
  </div>
  <script>
    (function() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var deepLink = 'com.zeroday.academy://auth/callback' + search + hash;
      var btn = document.getElementById('deepLinkBtn');
      if (btn) {
        btn.href = deepLink;
      }

      var isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
      if (isMobile) {
        if (btn) btn.style.display = 'inline-block';
        // Auto trigger deep link intent to reopen app
        window.location.href = deepLink;
      } else {
        // Desktop browser fallback: redirect to web dashboard with hash
        window.location.href = '/#' + (hash ? hash.replace(/^#/, '') : 'app');
      }
    })();
  </script>
</body>
</html>
