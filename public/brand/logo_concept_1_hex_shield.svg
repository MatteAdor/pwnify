<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1624"/>
      <stop offset="100%" stop-color="#04070D"/>
    </radialGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Luminous Emerald Linear Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Tactical Shield Outer Silhouette -->
  <path d="M 256,92 L 380,148 C 380,268 332,364 256,412 C 180,364 132,268 132,148 Z" 
        fill="#090E17" 
        stroke="url(#shieldBorder)" 
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Inner Cyber Contour Accent -->
  <path d="M 256,116 L 358,162 C 358,258 318,340 256,382 C 194,340 154,258 154,162 Z" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="1.5" 
        stroke-opacity="0.25"/>

  <!-- Core Symbol: Geometric Tactical "0x" Monogram -->
  <g transform="translate(162, 176)" filter="url(#emeraldGlow)">
    <!-- The "0" (Hexagonal Loop with Core Slash) -->
    <path d="M 46,16 L 82,16 L 102,48 L 102,96 L 82,128 L 46,128 L 26,96 L 26,48 Z" 
          fill="none" 
          stroke="url(#emeraldGrad)" 
          stroke-width="14" 
          stroke-linejoin="miter"/>
    <!-- Slash in 0 -->
    <line x1="38" y1="104" x2="90" y2="40" 
          stroke="#34D399" 
          stroke-width="8" 
          stroke-linecap="round"/>

    <!-- The "x" (Precision Intersection) -->
    <g transform="translate(112, 38)">
      <line x1="16" y1="16" x2="68" y2="88" 
            stroke="url(#emeraldGrad)" 
            stroke-width="14" 
            stroke-linecap="round"/>
      <line x1="68" y1="16" x2="16" y2="88" 
            stroke="url(#emeraldGrad)" 
            stroke-width="14" 
            stroke-linecap="round"/>
    </g>
  </g>

  <!-- Precision Crosshair Micro-Notches -->
  <circle cx="256" cy="92" r="3" fill="#34D399"/>
  <circle cx="132" cy="148" r="2.5" fill="#10B981"/>
  <circle cx="380" cy="148" r="2.5" fill="#10B981"/>
  <circle cx="256" cy="412" r="3" fill="#34D399"/>
</svg>
