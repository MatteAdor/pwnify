apply plugin: 'com.android.application'

android {
    namespace = "com.zeroday.academy"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    flavorDimensions = ["distribution"]
    productFlavors {
        play {
            dimension = "distribution"
            buildConfigField "String", "DISTRIBUTION_FLAVOR", "\"play\""
        }
        direct {
            dimension = "distribution"
            buildConfigField "String", "DISTRIBUTION_FLAVOR", "\"direct\""
        }
    }
    defaultConfig {
        applicationId "com.zeroday.academy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.2.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.apk:downloads'
        }
    }
    // Security Guardrail: Reject signing credentials defined in project repository files
    def forbiddenSigningKeys = [
        "ZERODAY_KEYSTORE_PATH",
        "ZERODAY_KEYSTORE_PASSWORD",
        "ZERODAY_KEY_ALIAS",
        "ZERODAY_KEY_PASSWORD"
    ]
    [rootProject.file("gradle.properties"), project.file("gradle.properties")].each { propFile ->
        if (propFile.exists()) {
            def props = new Properties()
            propFile.withInputStream { is -> props.load(is) }
            def leaks = forbiddenSigningKeys.findAll { k -> props.containsKey(k) }
            if (!leaks.isEmpty()) {
                throw new GradleException("SECURITY VIOLATION: Project file '${propFile.name}' defines forbidden signing parameters: ${leaks.join(', ')}.\n" +
                    "Signing credentials must NEVER be placed in repository files.\n" +
                    "Configure them ONLY in ~/.gradle/gradle.properties (%USERPROFILE%/.gradle/gradle.properties) or as environment variables.")
            }
        }
    }

    def getSecureSigningProperty = { String key ->
        def envVal = System.getenv(key) ?: (key.startsWith("ZERODAY_") ? System.getenv(key.replace("ZERODAY_", "ANDROID_")) : null)
        if (envVal) {
            return envVal.trim()
        }
        def userHome = System.getProperty("user.home")
        def userPropFile = new File(userHome, ".gradle/gradle.properties")
        if (userPropFile.exists()) {
            def userProps = new Properties()
            userPropFile.withInputStream { is -> userProps.load(is) }
            if (userProps.containsKey(key)) {
                def val = userProps.getProperty(key)
                if (val != null) return val.trim()
            }
        }
        def propVal = project.findProperty(key)
        if (propVal != null) {
            return propVal.toString().trim()
        }
        return null
    }

    signingConfigs {
        release {
            def ksPath = getSecureSigningProperty("ZERODAY_KEYSTORE_PATH")
            if (ksPath) {
                def ksFile = file(ksPath).isAbsolute() ? file(ksPath) : rootProject.file(ksPath)
                if (ksFile.exists()) {
                    storeFile ksFile
                    storePassword (getSecureSigningProperty("ZERODAY_KEYSTORE_PASSWORD") ?: "")
                    keyAlias (getSecureSigningProperty("ZERODAY_KEY_ALIAS") ?: "")
                    keyPassword (getSecureSigningProperty("ZERODAY_KEY_PASSWORD") ?: "")
                }
            }
        }
    }

    gradle.taskGraph.whenReady { taskGraph ->
        def isReleaseTask = taskGraph.allTasks.any { task ->
            def n = task.name.toLowerCase()
            return n.contains("releasedirect") || n.contains("releaseplay") || 
                   n.contains("assembleplayrelease") || n.contains("assembledirectrelease") || 
                   n.contains("bundleplayrelease") || n.contains("bundledirectrelease")
        }
        if (isReleaseTask) {
            def ksPath = getSecureSigningProperty("ZERODAY_KEYSTORE_PATH")
            def ksPass = getSecureSigningProperty("ZERODAY_KEYSTORE_PASSWORD")
            def kAlias = getSecureSigningProperty("ZERODAY_KEY_ALIAS")
            def kPass = getSecureSigningProperty("ZERODAY_KEY_PASSWORD")

            def missing = []
            if (!ksPath) missing << "ZERODAY_KEYSTORE_PATH"
            if (!ksPass) missing << "ZERODAY_KEYSTORE_PASSWORD"
            if (!kAlias) missing << "ZERODAY_KEY_ALIAS"
            if (!kPass) missing << "ZERODAY_KEY_PASSWORD"
            if (!missing.isEmpty()) {
                throw new GradleException("BUILD FAILED: Missing required release signing credentials: ${missing.join(', ')}\n" +
                    "Configure them in %USERPROFILE%/.gradle/gradle.properties (or ~/.gradle/gradle.properties) or as environment variables.")
            }
            def ksFile = file(ksPath).isAbsolute() ? file(ksPath) : rootProject.file(ksPath)
            if (!ksFile.exists()) {
                throw new GradleException("BUILD FAILED: Keystore file does not exist at: ${ksFile.absolutePath}")
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
