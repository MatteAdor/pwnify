apply plugin: 'com.android.application'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def getSignProp = { String key ->
    project.findProperty(key) ?: localProperties.getProperty(key) ?: System.getenv(key) ?: System.getenv(key.replace("ZERODAY_", "ANDROID_"))
}

android {
    namespace = "com.zeroday.academy"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    flavorDimensions = ["distribution"]
    productFlavors {
        play {
            dimension = "distribution"
            buildConfigField "String", "DISTRIBUTION_FLAVOR", "\"play\""
        }
        direct {
            dimension = "distribution"
            buildConfigField "String", "DISTRIBUTION_FLAVOR", "\"direct\""
        }
    }
    defaultConfig {
        applicationId "com.zeroday.academy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.2.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.apk:downloads'
        }
    }
    signingConfigs {
        release {
            def ksPath = getSignProp("ZERODAY_KEYSTORE_PATH")
            if (ksPath) {
                def ksFile = file(ksPath).isAbsolute() ? file(ksPath) : rootProject.file(ksPath)
                if (ksFile.exists()) {
                    storeFile ksFile
                    storePassword (getSignProp("ZERODAY_KEYSTORE_PASSWORD") ?: "")
                    keyAlias (getSignProp("ZERODAY_KEY_ALIAS") ?: "")
                    keyPassword (getSignProp("ZERODAY_KEY_PASSWORD") ?: "")
                }
            }
        }
    }

    gradle.taskGraph.whenReady { taskGraph ->
        def isReleaseTask = taskGraph.allTasks.any { task ->
            def n = task.name.toLowerCase()
            return n.contains("releasedirect") || n.contains("releaseplay") || 
                   n.contains("assembleplayrelease") || n.contains("assembledirectrelease") || 
                   n.contains("bundleplayrelease") || n.contains("bundledirectrelease")
        }
        if (isReleaseTask) {
            def ksPath = getSignProp("ZERODAY_KEYSTORE_PATH")
            def ksPass = getSignProp("ZERODAY_KEYSTORE_PASSWORD")
            def kAlias = getSignProp("ZERODAY_KEY_ALIAS")
            def kPass = getSignProp("ZERODAY_KEY_PASSWORD")

            if (!ksPath || !ksPass || !kAlias || !kPass) {
                throw new GradleException("BUILD FAILED: Missing required release signing credentials.\n" +
                    "Configure ZERODAY_KEYSTORE_PATH, ZERODAY_KEYSTORE_PASSWORD, ZERODAY_KEY_ALIAS, ZERODAY_KEY_PASSWORD\n" +
                    "in %USERPROFILE%/.gradle/gradle.properties (or ~/.gradle/gradle.properties) or as environment variables.")
            }
            def ksFile = file(ksPath).isAbsolute() ? file(ksPath) : rootProject.file(ksPath)
            if (!ksFile.exists()) {
                throw new GradleException("BUILD FAILED: Keystore file does not exist at: ${ksFile.absolutePath}")
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
