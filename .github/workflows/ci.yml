name: CI Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint, Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code quality linting
        run: npm run lint

      - name: Compile and build production bundle
        run: npm run build

      - name: Execute unit test suite
        run: npm test

      - name: Leak Detection - Audit dist bundle for sensitive strings
        run: |
          echo "Scanning dist/ for illegal internal secrets..."
          if grep -ri "service_role" dist/; then
            echo "::error::Found 'service_role' key in client distribution bundle!"
            exit 1
          fi
          if grep -ri "correct_index" dist/; then
            echo "::error::Found 'correct_index' in client distribution bundle!"
            exit 1
          fi
          echo "dist/ bundle is clean of server-side keys."

      - name: Secret Detection - Audit tracked repo files for GitHub token patterns
        run: |
          echo "Scanning repository for token leaks (GitHub token prefixes)..."
          LEAKS=$(git grep -EI "gh[opsu]_[0-9a-zA-Z]{36}" || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Detected exposed GitHub token pattern in repository files:"
            echo "$LEAKS"
            exit 1
          fi
          echo "No exposed GitHub token patterns found."

  database-regression:
    name: Supabase pgTAP & Concurrency Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start local Supabase container stack
        run: |
          sudo fuser -k 54321/tcp 54322/tcp 54323/tcp 54324/tcp 54325/tcp 54326/tcp 2>/dev/null || true
          if ! supabase start > /tmp/ci_supabase_start.log 2>&1; then
            cat /tmp/ci_supabase_start.log
            ERR=$(tail -n 30 /tmp/ci_supabase_start.log | tr '\r\n' ' ' | sed 's/"/\\"/g')
            echo "::error title=ci_supabase_start::$ERR"
            {
              echo "### Error in CI supabase start"
              echo '```'
              tail -n 30 /tmp/ci_supabase_start.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Configure Supabase Vault HMAC Secret
        run: |
          DYNAMIC_SECRET=$(openssl rand -hex 32)
          if ! psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 > /tmp/ci_vault_config.log 2>&1 << EOF
          CREATE EXTENSION IF NOT EXISTS supabase_vault CASCADE;
          SELECT vault.create_secret('$DYNAMIC_SECRET', 'daily_flash_secret', 'HMAC key for daily flash draws');
          EOF
          then
            cat /tmp/ci_vault_config.log
            ERR=$(tail -n 30 /tmp/ci_vault_config.log | tr '\r\n' ' ' | sed 's/"/\\"/g')
            echo "::error title=ci_vault_config::$ERR"
            {
              echo "### Error in CI Vault Config"
              echo '```'
              tail -n 30 /tmp/ci_vault_config.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Apply Phase C Contract Migrations (05-07)
        run: |
          for mig in supabase/contract/*.sql; do
            echo "Applying $(basename "$mig")..."
            if ! psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$mig" > /tmp/ci_contract_mig.log 2>&1; then
              cat /tmp/ci_contract_mig.log
              ERR=$(tail -n 30 /tmp/ci_contract_mig.log | tr '\r\n' ' ' | sed 's/"/\\"/g')
              echo "::error title=ci_contract_$(basename "$mig")::$ERR"
              {
                echo "### Error applying contract migration $(basename "$mig")"
                echo '```'
                tail -n 30 /tmp/ci_contract_mig.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

      - name: Run pgTAP test suite
        run: |
          if ! supabase test db > /tmp/ci_pgtap.log 2>&1; then
            cat /tmp/ci_pgtap.log
            ERR=$(tail -n 30 /tmp/ci_pgtap.log | tr '\r\n' ' ' | sed 's/"/\\"/g')
            echo "::error title=ci_pgtap_suite::$ERR"
            {
              echo "### Error in CI pgTAP suite"
              echo '```'
              tail -n 30 /tmp/ci_pgtap.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat /tmp/ci_pgtap.log

      - name: Run parallel matchmaking concurrency harness
        run: |
          chmod +x supabase/tests/concurrency.sh
          if ! ./supabase/tests/concurrency.sh > /tmp/ci_concurrency.log 2>&1; then
            cat /tmp/ci_concurrency.log
            ERR=$(tail -n 30 /tmp/ci_concurrency.log | tr '\r\n' ' ' | sed 's/"/\\"/g')
            echo "::error title=ci_concurrency_harness::$ERR"
            {
              echo "### Error in CI concurrency harness"
              echo '```'
              tail -n 30 /tmp/ci_concurrency.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat /tmp/ci_concurrency.log

      - name: Teardown Supabase containers
        if: always()
        run: supabase stop --no-backup
