name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Eseguire solo simulazione db push (--dry-run) senza applicare modifiche'
        required: true
        type: boolean
        default: true
      confirm_prod_deploy:
        description: 'Digitare "DEPLOY-PRODUCTION" per confermare il rilascio effettivo (ignorato se dry_run=true)'
        required: false
        type: string
        default: ''
      allow_other_migrations:
        description: 'Consenti migrazioni diverse da 20261024000001-04'
        required: false
        type: boolean
        default: false
      deploy_functions:
        description: 'Esegui deploy delle Edge Functions (get_turn_credentials)'
        required: false
        type: boolean
        default: false
      seed_questions:
        description: 'Esegui seed remoto delle domande cifrate'
        required: false
        type: boolean
        default: false
      trigger_frontend:
        description: 'Esegui webhook di trigger deploy frontend'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production (Approval Required)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify explicit production release confirmation
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "${{ inputs.confirm_prod_deploy }}" != "DEPLOY-PRODUCTION" ]; then
            echo "::error::Deploy aborted: confirmation phrase does not match 'DEPLOY-PRODUCTION'."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Link Production Project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROD_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}

      - name: Apply Database Migrations to Production (Dry Run)
        if: ${{ inputs.dry_run }}
        run: |
          supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}

      - name: Verify Pending Migrations (Safety Guard)
        if: ${{ !inputs.dry_run }}
        run: |
          echo "Inspecting pending migrations via dry-run simulation..."
          DRY_RUN_OUTPUT=$(supabase db push --dry-run 2>&1 || true)
          echo "$DRY_RUN_OUTPUT"

          if [ "${{ inputs.allow_other_migrations }}" != "true" ]; then
            UNAPPROVED=$(echo "$DRY_RUN_OUTPUT" | grep -Eo "[0-9]{14}_[a-zA-Z0-9_]+\.sql" | grep -vE "^2026102400000[1-4]_" || true)
            if [ -n "$UNAPPROVED" ]; then
              echo "::error title=unapproved_migrations::Found pending migrations outside Phase A (20261024000001-04): $UNAPPROVED. Aborting release."
              exit 1
            fi
            echo "All pending migrations verified to be Phase A (20261024000001-04)."
          else
            echo "allow_other_migrations is true: skipping strict Phase A restriction."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}

      - name: Apply Database Migrations to Production
        if: ${{ !inputs.dry_run }}
        run: |
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}

      - name: Deploy Edge Functions to Production
        if: ${{ !inputs.dry_run && inputs.deploy_functions }}
        run: |
          supabase functions deploy get_turn_credentials --project-ref ${{ secrets.SUPABASE_PROD_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Seed Questions to Production (In-Memory Decryption)
        if: ${{ !inputs.dry_run && inputs.seed_questions && env.QUESTION_BANK_KEY != '' && env.QUESTION_BANK_REMOTE_URL != '' }}
        run: |
          npm ci
          node scripts/seed_questions_remote.cjs
        env:
          QUESTION_BANK_KEY: ${{ secrets.QUESTION_BANK_KEY }}
          QUESTION_BANK_REMOTE_URL: ${{ secrets.QUESTION_BANK_REMOTE_URL }}
          QUESTION_BANK_AUTH_TOKEN: ${{ secrets.QUESTION_BANK_AUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}

      - name: Trigger Frontend Deploy (Vercel / Cloudflare Hook)
        if: ${{ !inputs.dry_run && inputs.trigger_frontend && env.DEPLOY_HOOK_URL != '' }}
        run: |
          curl -X POST -s -o /dev/null -w "%{http_code}" "$DEPLOY_HOOK_URL"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
