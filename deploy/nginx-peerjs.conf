# Nginx configuration for ZeroDay PeerServer (WSS reverse proxy)
# Place under /etc/nginx/sites-available/peerjs and link to sites-enabled/

upstream peerjs_backend {
    server 127.0.0.1:9000;
    keepalive 32;
}

server {
    listen 80;
    server_name peer.zeroday.gg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name peer.zeroday.gg;

    ssl_certificate /etc/letsencrypt/live/peer.zeroday.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peer.zeroday.gg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /peerjs {
        proxy_pass http://peerjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Keep WebRTC signaling websocket alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
